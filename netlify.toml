[build]
  publish = "public"

[[headers]]
  for = "/login.html"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
